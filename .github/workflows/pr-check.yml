name: PR Checks
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-typst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
      - name: Compile Typst
        run: ./scripts/compile-typst.sh all

  compile-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Python syntax
        run: ./scripts/compile-py.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run unit and stress tests
        run: ./scripts/run-tests.sh

  check-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check kebab-case naming
        run: ./scripts/check-names.sh
